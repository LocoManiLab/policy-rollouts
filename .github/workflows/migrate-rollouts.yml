name: Migrate all original selected policy rollouts

"on":
  push:
    branches: [main]
    paths: [migration-request.json]
  workflow_dispatch:
    inputs:
      prototype_verified:
        description: Original sample playback and long seeking have passed
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: original-rollout-release-migration
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - name: Check approved request, real prototype evidence, and complete committed source list
        env:
          MIGRATION_EVENT: ${{ github.event_name }}
          MIGRATION_PROTOTYPE_INPUT: ${{ inputs.prototype_verified }}
        run: >-
          python3 scripts/release-migration-control.py preflight
          --plan release-plan.json --prototype prototype-verification.json
          --event "$MIGRATION_EVENT" --prototype-input "$MIGRATION_PROTOTYPE_INPUT"
          --request migration-request.json --repository "$GITHUB_REPOSITORY" --git-tree

  dp_robocasa:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            originals/dp_robocasa
          persist-credentials: true
      - name: Resume verified original dp_robocasa files with serial paced writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/github-release-media.py sync
          --manifest release-plan.json --policy dp_robocasa
          --create-releases --write-interval 8 --report reports/dp_robocasa.json
          --failure-report reports/dp_robocasa-failure.json
      - name: Publish only a safe classified failure for autonomous recovery
        if: failure()
        run: |
          if [ ! -f reports/dp_robocasa-failure.json ]; then exit 0; fi
          git fetch origin main
          git checkout -B codex/publish-failure-status origin/main
          python3 scripts/release-migration-control.py failure-status \
            --plan release-plan.json --prototype prototype-verification.json \
            --failure-report reports/dp_robocasa-failure.json --run-id "$GITHUB_RUN_ID" \
            --output migration-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record safe original rollout migration failure status'
          git push origin HEAD:main
      - name: Retain public-safe progress, including a partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verified-dp_robocasa
          path: reports/dp_robocasa.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

