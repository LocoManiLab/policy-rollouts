        run: |
          git fetch origin main
          git checkout -B codex/publish-complete-proof origin/main
          python3 scripts/release-migration-control.py finalize \
            --plan release-plan.json --prototype prototype-verification.json \
            --reports policy-reports --remote-report final-remote.json \
            --output hosting/policy-rollouts-releases.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosting/policy-rollouts-releases.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish fully verified original rollout release index'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-rollout-verification
          path: |
            final-remote.json
            hosting/policy-rollouts-releases.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
