name: Publish playback validation samples

on:
  push:
    branches: [main]
    paths:
      - prototype/**
      - prototype.json
      - scripts/upload-prototype.py
      - .github/workflows/release-prototype.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-prototype
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Publish verified original sample files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upload-prototype.py
